name: Deploy production

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full main commit SHA you visually inspected and approve for release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify visual approval matches this release
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$REVIEWED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Run from main and provide the full SHA of that visually inspected commit."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks before publishing
        run: npm run check

      - name: Stage the site
        run: ./scripts/stage-site.sh _site

      - name: Publish production
        uses: JamesIves/github-pages-deploy-action@4a3abc783e1a24aeb44c16e869ad83caf6b4cc23 # v4.7.4
        with:
          branch: gh-pages
          folder: _site
          clean-exclude: preview
          force: false
          commit-message: Deploy production from ${{ github.sha }}
