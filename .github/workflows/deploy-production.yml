name: Deploy production

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full main commit SHA you visually inspected and approve for release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify visual approval matches this release
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$REVIEWED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Run from main and provide the full SHA of that visually inspected commit."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Cache Tectonic resources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-0.17.0-${{ hashFiles('cv/**/*.tex') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-0.17.0-

      - name: Set up Tectonic
        uses: WtfJoke/setup-tectonic@eb29fd68b7d3f76011906b6e45ea4320c8de5d2f # v4
        with:
          tectonic-version: 0.17.0

      - name: Install dependencies
        run: npm ci

      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run checks before publishing
        run: npm run check

      - name: Stage the site
        run: ./scripts/stage-site.sh _site

      - name: Publish production
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: _site
          clean-exclude: preview
          force: false
          commit-message: Deploy production from ${{ github.sha }}
