name: Deploy main preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-main-preview
  cancel-in-progress: false

jobs:
  preview:
    name: Deploy main preview
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Cache Tectonic resources
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-0.17.0-${{ hashFiles('cv/**/*.tex') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-0.17.0-

      - name: Set up Tectonic
        uses: WtfJoke/setup-tectonic@eb29fd68b7d3f76011906b6e45ea4320c8de5d2f # v4
        with:
          tectonic-version: 0.17.0

      - name: Install dependencies
        run: npm ci

      - name: Run checks before publishing
        run: npm run check

      - name: Stage the site
        run: |
          ./scripts/stage-site.sh "${RUNNER_TEMP}/site"
          printf '%s\n' "$GITHUB_SHA" > "${RUNNER_TEMP}/site/revision.txt"
          sed -i '/<head>/a\    <meta name="robots" content="noindex" />' "${RUNNER_TEMP}/site/index.html"

      - name: Check that this preview is still current
        id: freshness
        run: |
          latest_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipped an outdated preview; main has advanced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy preview
        if: steps.freshness.outputs.current == 'true'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          branch: gh-pages
          folder: ${{ runner.temp }}/site
          target-folder: preview
          force: false
          commit-message: Deploy main preview from ${{ github.sha }}

      - name: Report preview
        if: steps.freshness.outputs.current == 'true'
        run: |
          printf '[Main preview](https://jefequien.github.io/preview/) — commit `%s`.\n\nAllow GitHub Pages to finish publishing; confirm the SHA in [revision.txt](https://jefequien.github.io/preview/revision.txt) before reviewing.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
